name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        umbraco-major: [ 17, 18 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/IndexNow.slnx -c Release -p:UmbracoMajor=${{ matrix.umbraco-major }}

      - name: Test
        run: dotnet test src/IndexNow.slnx -c Release --no-build -p:UmbracoMajor=${{ matrix.umbraco-major }}
